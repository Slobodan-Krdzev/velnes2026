name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velnes
          POSTGRES_USER: velnes
          POSTGRES_PASSWORD: velnes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velnes -d velnes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://velnes:velnes@localhost:5432/velnes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_API_DATABASE_URL: postgres://velnes_api:velnes_api@localhost:5432/velnes
      - name: Publish e2e failure evidence
        if: failure()
        run: |
          mkdir -p /tmp/dbg && find test-results -name 'error-context.md' -exec sh -c 'cp "$1" /tmp/dbg/$(echo "$1" | tr "/" "_")' _ {} \; 2>/dev/null || true
          ls /tmp/dbg | head
          git config user.email ci@velnes && git config user.name ci
          git checkout --orphan ci-debug && git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf ci-debug-out && mkdir ci-debug-out && cp /tmp/dbg/* ci-debug-out/ 2>/dev/null || echo 'no contexts' > ci-debug-out/empty.txt
          git add -f ci-debug-out && git commit -m "e2e failure evidence $GITHUB_RUN_ID" >/dev/null
          git push -f origin ci-debug
