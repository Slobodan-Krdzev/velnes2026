name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: velnes
          POSTGRES_USER: velnes
          POSTGRES_PASSWORD: velnes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velnes -d velnes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://velnes:velnes@localhost:5432/velnes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_API_DATABASE_URL: postgres://velnes_api:velnes_api@localhost:5432/velnes
