# Velnes API behind the VPS's existing Nginx (deploy/DEPLOY.md).
#
# Install: copy to /etc/nginx/sites-available/velnes-api, set server_name,
# symlink into sites-enabled, `nginx -t`, then `systemctl reload nginx`.
# certbot --nginx -d api.<domain> adds the 443 listener to this block.
#
# The API listens on 127.0.0.1:6000 only (HOST/PORT in its .env) and
# trusts X-Forwarded-* from 127.0.0.1 (TRUST_PROXY), so the rate limits
# key on the visitor's address, not on the proxy's.

server {
    listen 80;
    listen [::]:80;
    server_name api.velnes.example;   # ← the real API hostname

    # The gallery upload sends up to 10 MiB of photos in one request.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
